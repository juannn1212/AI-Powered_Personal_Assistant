name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  migraciones-postgres:
    name: migraciones en PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Solo lo necesario para Alembic; TensorFlow no hace falta para migrar
      - run: pip install sqlalchemy==2.0.23 alembic==1.13.0 psycopg2-binary==2.9.9 python-dotenv==1.0.0
      - run: alembic upgrade head
      - run: alembic check
      - name: Subida, bajada y subida otra vez
        run: |
          alembic downgrade base
          alembic upgrade head
